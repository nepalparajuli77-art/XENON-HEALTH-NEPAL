<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="280" fill="#DC2626" opacity="0.12" filter="blur(90px)"/>
  <circle cx="1050" cy="200" r="320" fill="#2563EB" opacity="0.14" filter="blur(100px)"/>
  <circle cx="600" cy="550" r="260" fill="#10B981" opacity="0.10" filter="blur(90px)"/>

  <!-- Grid mesh overlay -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- ECG Heartbeat Line across the card -->
  <path d="M 80,480 L 320,480 L 345,440 L 365,510 L 390,390 L 420,530 L 440,470 L 465,480 L 1120,480"
        fill="none" stroke="#DC2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Top Badge -->
  <rect x="90" y="80" width="340" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
  <circle cx="115" cy="101" r="6" fill="#10B981"/>
  <text x="135" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
    NEPAL MEDICAL COUNCIL VERIFIED
  </text>

  <!-- Brand Title -->
  <text x="90" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
    XENON HEALTH
  </text>
  <text x="640" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="url(#primaryGrad)">
    NEPAL
  </text>

  <!-- Tagline / Headline -->
  <text x="90" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#E2E8F0">
    AI Clinical Telemedicine &amp; Doctor Verification
  </text>

  <!-- Subtitle in Devanagari & English -->
  <text x="90" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94A3B8">
    नेपालको पहिलो AI स्वास्थ्य सहायक • NMC प्रमाणित विशेषज्ञ डाक्टरहरू • आपतकालीन १०२
  </text>

  <!-- Feature Pills -->
  <g transform="translate(90, 360)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="44" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">
      🛡️ NMC Doctor Registry
    </text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="230" height="44" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="255" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">
      🤖 24/7 Xenon AI Triage
    </text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="200" height="44" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="500" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">
      🏥 Hospitals &amp; ICU
    </text>

    <!-- Pill 4 -->
    <rect x="695" y="0" width="210" height="44" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="715" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">
      🚨 Emergency SOS 102
    </text>
  </g>

  <!-- Bottom Authority Footer -->
  <text x="90" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748B">
    Kathmandu • Pokhara • Dharan • Chitwan • All 77 Districts of Nepal
  </text>
  <text x="1110" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#EF4444" text-anchor="end">
    xenonhealth.org.np
  </text>
</svg>
